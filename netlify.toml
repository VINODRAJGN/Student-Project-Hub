[build]
  command   = "pnpm install --frozen-lockfile && pnpm --filter @workspace/vs-implements run build"
  publish   = "artifacts/vs-implements/dist/public"

[build.environment]
  NODE_VERSION = "20"
  BASE_PATH    = "/"

# SPA fallback — all routes served by index.html
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
